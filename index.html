<script>
function hashString(value) {
  let hash = 2166136261;
  for (let i = 0; i < value.length; i++) {
    hash ^= value.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

function fallbackCover(path) {
  const label = fileLabel(path || 'audio');
  const palettes = [
    ['0d0d0f', 'c8f564'],
    ['16161a', '64c8f5'],
    ['1e1e24', 'f5a064'],
    ['0d0d0f', 'f564a0'],
    ['16161a', 'a064f5'],
    ['1e1e24', 'f5d064'],
    ['101014', 'e8e6e3'],
  ];
  const [bg, fg] = palettes[hashString(label) % palettes.length];
  return `https://placehold.co/300/${bg}/${fg}/png?text=${encodeURIComponent(label)}`;
}

audioFiles = audioFiles.map((file, index) => {
  if (!file || typeof file.path !== 'string' || file.path.trim() === '') {
    console.warn(`Skipping audioFiles[${index}]: missing path`);
    return null;
  }

  const tags = Array.isArray(file.tags)
    ? file.tags.filter(tag => typeof tag === 'string' && tag.trim() !== '')
    : (typeof file.tags === 'string' && file.tags.trim() !== '' ? [file.tags] : []);

  return {
    path: file.path,
    src: typeof file.src === 'string' && file.src.trim() !== '' ? file.src : file.path,
    sourceFile: file.sourceFile || null,
    tags,
    group: typeof file.group === 'string' && file.group.trim() !== '' ? file.group.trim() : null,
    cues: Array.isArray(file.cues) ? file.cues.filter(cue => typeof cue === 'string' && cue.trim() !== '') : [],
    cueTimes: Array.isArray(file.cues) ? file.cues.map(parseCueTime).filter(Number.isFinite) : [],
    albumCover: typeof file.albumCover === 'string' && file.albumCover.trim() !== ''
      ? file.albumCover
      : fallbackCover(file.path),
  };
}).filter(Boolean);

const groupCounts = new Map();
audioFiles.forEach(file => {
  if (!file.group) return;
  groupCounts.set(file.group, (groupCounts.get(file.group) || 0) + 1);
});
const groupColors = new Map();

/* derive filename from path, strip extension */
function fileLabel(path) {
  const part = path.split(/[\\/]/).pop() || path;
  return part.replace(/\.[^.]+$/, '');
}

/* ── STATE ── */
let globalVolume = 1;
let currentAudio = null;
let currentIndex = -1;
let currentCard  = null;
let repeatOne = false;
let autoNext = false;
const selectedTags = new Set();
const failedTrackIndexes = new Set();
const droppedObjectUrls = [];
const groupPlaybackTimes = new Map();
const trackAudios = new Map();

/* ── HELPERS ── */
function fmtTime(s) {
  if (!isFinite(s) || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const ss = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${ss}`;
}

function hasSharedGroup(file) {
  return !!file?.group && (groupCounts.get(file.group) || 0) > 1;
}

function colorForGroup(group) {
  if (groupColors.has(group)) return groupColors.get(group);

  let hash = 0;
  for (let i = 0; i < group.length; i++) {
    hash = ((hash << 5) - hash + group.charCodeAt(i)) | 0;
  }

  const hue = Math.abs(hash) % 360;
  const color = `hsl(${hue} 80% 80%)`;
  groupColors.set(group, color);
  return color;
}

function rememberGroupPlaybackTime(idx, audio) {
  const file = audioFiles[idx];
  if (!hasSharedGroup(file) || !audio || !Number.isFinite(audio.currentTime)) return;
  groupPlaybackTimes.set(file.group, audio.currentTime);
}

function sharedGroupPlaybackTime(file) {
  if (!hasSharedGroup(file)) return null;
  const time = groupPlaybackTimes.get(file.group);
  return Number.isFinite(time) ? time : null;
}

function seekAudio(audio, seconds) {
  if (!audio || !Number.isFinite(seconds)) return;
  audio.currentTime = Math.max(0, audio.duration ? Math.min(seconds, audio.duration) : seconds);
}

function parseCueTime(value) {
  if (typeof value !== 'string') return NaN;
  const parts = value.trim().split(':').map(part => Number(part));
  if (parts.length < 2 || parts.length > 3 || parts.some(part => !Number.isFinite(part) || part < 0)) return NaN;

  if (parts.length === 2) {
    const [minutes, seconds] = parts;
    return minutes * 60 + seconds;
  }

  const [hours, minutes, seconds] = parts;
  return hours * 3600 + minutes * 60 + seconds;
}

function isAudioFile(file) {
  return file && (
    file.type.startsWith('audio/') ||
    /\.(aac|aif|aiff|flac|m4a|mp3|ogg|opus|wav|webm)$/i.test(file.name)
  );
}

function createDropGroupName(files) {
  const seed = files.map(file => file.name).join('|') + Date.now().toString(36);
  return `drop-${hashString(seed).toString(36)}`;
}

function createDroppedTrack(file, group = null) {
  const url = URL.createObjectURL(file);
  droppedObjectUrls.push(url);
  return {
    path: file.name,
    src: url,
    sourceFile: file,
    tags: ['dropped'],
    group,
    cues: [],
    cueTimes: [],
    albumCover: fallbackCover(file.name),
  };
}

function addToGroupCounts(tracks) {
  tracks.forEach(track => {
    if (!track.group) return;
    groupCounts.set(track.group, (groupCounts.get(track.group) || 0) + 1);
  });
}

function shiftTrackStateIndexes(offset) {
  if (offset <= 0) return;

  const shiftedAudios = new Map();
  trackAudios.forEach((audio, idx) => {
    shiftedAudios.set(idx + offset, audio);
  });
  trackAudios.clear();
  shiftedAudios.forEach((audio, idx) => trackAudios.set(idx, audio));

  const shiftedFailures = new Set();
  failedTrackIndexes.forEach(idx => shiftedFailures.add(idx + offset));
  failedTrackIndexes.clear();
  shiftedFailures.forEach(idx => failedTrackIndexes.add(idx));

  if (currentIndex >= 0) currentIndex += offset;
}

function addDroppedAudioFiles(fileList) {
  const audioFilesToAdd = [...fileList].filter(isAudioFile);
  const group = audioFilesToAdd.length > 1 ? createDropGroupName(audioFilesToAdd) : null;
  const tracks = audioFilesToAdd.map(file => createDroppedTrack(file, group));
  if (!tracks.length) return;

  shiftTrackStateIndexes(tracks.length);
  audioFiles.unshift(...tracks);
  addToGroupCounts(tracks);
  selectedTags.clear();
  renderTags();
  renderList();
}

function toggleTagFilter(tag) {
  if (tag === 'All') {
    selectedTags.clear();
  } else if (selectedTags.has(tag)) {
    selectedTags.delete(tag);
  } else {
    selectedTags.add(tag);
  }
  renderTags();
  renderList();
}

function visibleTrackIndexes() {
  return [...document.querySelectorAll('.audio-item')].map(card => Number(card.dataset.idx));
}

function renderCueButtons(file) {
  const c = document.getElementById('cue-pads');
  c.innerHTML = '';
  const cueTimes = file?.cueTimes || [];

  cueTimes.forEach((seconds, index) => {
    const btn = document.createElement('button');
    btn.className = 'cue-btn';
    btn.type = 'button';
    btn.textContent = String(index + 1);
    btn.title = `Jump to ${file.cues[index] || fmtTime(seconds)}`;
    btn.setAttribute('aria-label', `Jump to cue ${index + 1}`);
    btn.onclick = () => {
      if (!currentAudio) return;
      seekAudio(currentAudio, seconds);
      rememberGroupPlaybackTime(currentIndex, currentAudio);
      updateProgress(currentAudio);
    };
    c.appendChild(btn);
  });
}

function playTrackByIndex(idx, options = {}) {
  const card = document.querySelector(`.audio-item[data-idx="${idx}"]`);
  if (!card || card.classList.contains('broken')) return false;
  const trackVol = card.querySelector('.card-vol input');
  const eqBars = card.querySelector('.eq-bars');
  const overlay = card.querySelector('.play-overlay');
  const audio = getTrackAudio(idx);
  playTrack(idx, card, audio, trackVol, eqBars, overlay, options);
  return true;
}

function currentVisuals(idx) {
  const card = document.querySelector(`.audio-item[data-idx="${idx}"]`);
  return {
    card,
    eqBars: card?.querySelector('.eq-bars') || null,
    overlay: card?.querySelector('.play-overlay') || null,
  };
}

function getTrackAudio(globalIdx) {
  if (trackAudios.has(globalIdx)) return trackAudios.get(globalIdx);

  const file = audioFiles[globalIdx];
  const audio = new Audio();
  audio.preload = 'none';
  audio.src = file.src || file.path;
  audio.volume = globalVolume;

  audio.addEventListener('timeupdate', () => {
    if (currentAudio === audio) updateProgress(audio);
  });
  audio.addEventListener('loadedmetadata', () => {
    if (currentAudio === audio) {
      if (audio._resetOnMetadata) {
        seekAudio(audio, 0);
        audio._resetOnMetadata = false;
      } else if (audio._useSharedTime !== false) {
        const sharedTime = sharedGroupPlaybackTime(file);
        if (sharedTime !== null) seekAudio(audio, sharedTime);
      }
      document.getElementById('time-dur').textContent = fmtTime(audio.duration);
      updateProgress(audio);
    }
  });
  audio.addEventListener('ended', () => {
    handleTrackEnded(audioFiles.indexOf(file), audio);
  });
  audio.addEventListener('error', () => {
    handleTrackError(audioFiles.indexOf(file));
  });
  audio.addEventListener('playing', () => {
    const idx = audioFiles.indexOf(file);
    failedTrackIndexes.delete(idx);
    currentVisuals(idx).card?.classList.remove('broken');
  });

  trackAudios.set(globalIdx, audio);
  return audio;
}

function nextTrackIndex(fromIdx, skipped = new Set()) {
  const order = visibleTrackIndexes();
  if (order.length === 0) return -1;
  const blocked = new Set([...failedTrackIndexes, ...skipped]);
  const start = order.indexOf(fromIdx);

  for (let offset = 1; offset <= order.length; offset++) {
    const candidate = order[(start + offset) % order.length];
    if (!blocked.has(candidate)) return candidate;
  }

  return -1;
}

function playNextTrack(fromIdx, skipped = new Set(), options = {}) {
  const nextIdx = nextTrackIndex(fromIdx, skipped);
  return nextIdx >= 0 && playTrackByIndex(nextIdx, options);
}

function finishCurrentTrack(eqBars, overlay) {
  if (!eqBars || !overlay) {
    const visuals = currentVisuals(currentIndex);
    eqBars = visuals.eqBars;
    overlay = visuals.overlay;
  }
  if (eqBars && overlay) setPlayingState(false, eqBars, overlay);
  if (currentCard) currentCard.classList.remove('playing');
  document.getElementById('icon-play').style.display = '';
  document.getElementById('icon-pause').style.display = 'none';
}

function markTrackBroken(globalIdx) {
  failedTrackIndexes.add(globalIdx);
  document.querySelector(`.audio-item[data-idx="${globalIdx}"]`)?.classList.add('broken');
}

function handleTrackEnded(globalIdx, audio) {
  if (currentIndex !== globalIdx) return;
  const { eqBars, overlay } = currentVisuals(globalIdx);

  if (repeatOne) {
    audio.currentTime = 0;
    audio.play().catch(() => {});
    if (eqBars && overlay) setPlayingState(true, eqBars, overlay);
    document.getElementById('icon-play').style.display = 'none';
    document.getElementById('icon-pause').style.display = '';
    return;
  }

  if (autoNext && playNextTrack(globalIdx, new Set(), { resetPosition: true, useSharedTime: false })) return;

  finishCurrentTrack(eqBars, overlay);
}

function handleTrackError(globalIdx) {
  if (currentIndex !== globalIdx) return;
  const { eqBars, overlay } = currentVisuals(globalIdx);

  markTrackBroken(globalIdx);
  finishCurrentTrack(eqBars, overlay);
  if (autoNext) playNextTrack(globalIdx, new Set([globalIdx]), { resetPosition: true, useSharedTime: false });
}

/* ── RENDER TAGS ── */
function renderTags() {
  const c = document.getElementById('tag-container');
  c.innerHTML = '';
  const allTags = ['All', ...new Set(audioFiles.flatMap(f => f.tags))];
  allTags.forEach(tag => {
    const el = document.createElement('span');
    el.className = 'tag-pill' + (tag === 'All' && selectedTags.size === 0 ? ' selected' : '');
    el.dataset.tag = tag;
    el.textContent = tag;
    el.onclick = () => toggleTagFilter(tag);
    if (tag !== 'All' && selectedTags.has(tag)) el.classList.add('selected');
    c.appendChild(el);
  });
}

/* ── RENDER LIST ── */
function renderList() {
  const list = document.getElementById('audio-list');
  list.innerHTML = '';
  const filtered = selectedTags.size === 0
    ? audioFiles
    : audioFiles.filter(f => [...selectedTags].every(t => f.tags.includes(t)));

  document.getElementById('track-count').textContent = `${filtered.length} track${filtered.length !== 1 ? 's' : ''}`;

  filtered.forEach((file, idx) => {
    const globalIdx = audioFiles.indexOf(file);
    const card = document.createElement('div');
    card.className = 'audio-item';
    card.dataset.idx = globalIdx;

    /* cover */
    const coverWrap = document.createElement('div');
    coverWrap.className = 'cover-wrap';
    const img = document.createElement('img');
    img.src = file.albumCover;
    img.alt = fileLabel(file.path);
    img.loading = 'lazy';
    coverWrap.appendChild(img);

    /* overlay */
    const overlay = document.createElement('div');
    overlay.className = 'play-overlay';
    overlay.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="10 8 16 12 10 16 10 8" fill="white" stroke="none"/>
      </svg>`;
    const eqBars = document.createElement('div');
    eqBars.className = 'eq-bars paused';
    eqBars.style.cssText = 'position:absolute;bottom:10px;left:10px;';
    for (let i = 0; i < 4; i++) {
      const b = document.createElement('div');
      b.className = 'eq-bar';
      b.style.height = '4px';
      eqBars.appendChild(b);
    }
    coverWrap.appendChild(overlay);
    coverWrap.appendChild(eqBars);

    const brokenOverlay = document.createElement('div');
    brokenOverlay.className = 'broken-overlay';
    brokenOverlay.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M8 8l8 8"/>
        <path d="M16 8l-8 8"/>
      </svg>`;
    coverWrap.appendChild(brokenOverlay);

    if (hasSharedGroup(file)) {
      const groupBtn = document.createElement('div');
      groupBtn.className = 'group-btn';
      groupBtn.title = `Group: ${file.group}`;
      groupBtn.setAttribute('aria-label', `Group ${file.group}`);
      groupBtn.style.setProperty('--group-color', colorForGroup(file.group));

      const groupDot = document.createElement('span');
      groupDot.className = 'group-dot';
      groupBtn.appendChild(groupDot);
      coverWrap.appendChild(groupBtn);
    }

    /* ? info button + path popover */
    const infoBtn = document.createElement('button');
    infoBtn.className = 'info-btn';
    infoBtn.textContent = '?';
    infoBtn.title = 'Show file path';
    infoBtn.setAttribute('aria-label', 'Show file path');

    const popover = document.createElement('div');
    popover.className = 'path-popover';
    const popText = document.createElement('div');
    popText.className = 'path-popover-text';
    popText.textContent = file.path.startsWith('file:///') ? file.path.replace('file:///', '').replaceAll('/', '\\') : file.path;
    const copyBtn = document.createElement('button');
    copyBtn.className = 'path-copy-btn';
    copyBtn.textContent = 'copy path';
    copyBtn.onclick = e => {
      e.stopPropagation();
      navigator.clipboard.writeText(popText.textContent).then(() => {
        copyBtn.textContent = '✓ copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => { copyBtn.textContent = 'copy path'; copyBtn.classList.remove('copied'); }, 1800);
      });
    };
    popover.appendChild(popText);
    popover.appendChild(copyBtn);

    infoBtn.onclick = e => {
      e.stopPropagation();
      const isOpen = popover.classList.toggle('open');
      if (isOpen) {
        /* close any other open popovers */
        document.querySelectorAll('.path-popover.open').forEach(p => { if (p !== popover) p.classList.remove('open'); });
      }
    };

    coverWrap.appendChild(infoBtn);
    coverWrap.appendChild(popover);
    card.appendChild(coverWrap);

    /* info */
    const info = document.createElement('div');
    info.className = 'card-info';
    const titleEl = document.createElement('div');
    titleEl.className = 'card-title';
    titleEl.title = fileLabel(file.path);
    titleEl.textContent = fileLabel(file.path);
    info.appendChild(titleEl);
    const tagsEl = document.createElement('div');
    tagsEl.className = 'card-tags';
    file.tags.forEach(t => {
      const span = document.createElement('button');
      span.className = 'card-tag';
      span.dataset.tag = t;
      span.textContent = t;
      span.type = 'button';
      span.title = `Filter by ${t}`;
      span.setAttribute('aria-label', `Filter by ${t}`);
      span.onclick = e => {
        e.stopPropagation();
        toggleTagFilter(t);
      };
      tagsEl.appendChild(span);
    });
    info.appendChild(tagsEl);
    card.appendChild(info);

            /* per-track gain */
    const volRow = document.createElement('div');
    volRow.className = 'card-vol';
            const gainLabelCard = document.createElement('span');
            gainLabelCard.style.cssText = 'font-family:var(--mono);font-size:10px;color:var(--muted);flex-shrink:0;';
            gainLabelCard.textContent = 'gain';
            volRow.appendChild(gainLabelCard);
    const trackVol = document.createElement('input');
    trackVol.type = 'range';
            trackVol.min = 0; trackVol.max = 1.333; trackVol.step = 0.01;
    trackVol.value = 1;
            const trackGainPct = document.createElement('span');
            trackGainPct.style.cssText = 'font-family:var(--mono);font-size:10px;color:var(--muted);flex-shrink:0;min-width:30px;text-align:right;';
            trackGainPct.textContent = '100%';
    trackVol.onclick = e => e.stopPropagation();
    trackVol.oninput = e => {
      e.stopPropagation();
                const g = parseFloat(e.target.value);
                const fillPct = (g / 1.333) * 100;
                e.target.style.backgroundSize = fillPct.toFixed(1) + '% 100%';
                trackGainPct.textContent = Math.round(g * 100) + '%';
                trackGainPct.style.color = g > 1.005 ? 'var(--accent)' : 'var(--muted)';
                if (currentIndex === globalIdx && currentAudio) currentAudio.volume = Math.min(1, g * globalVolume);
    };
    volRow.appendChild(trackVol);
            volRow.appendChild(trackGainPct);
    card.appendChild(volRow);

    const audio = getTrackAudio(globalIdx);
    audio.volume = Math.min(1, parseFloat(trackVol.value) * globalVolume);

    /* click to play */
    coverWrap.addEventListener('click', () => playTrack(globalIdx, card, audio, trackVol, eqBars, overlay));

    /* if currently playing this track, restore state */
    if (currentIndex === globalIdx) {
      card.classList.add('playing');
      eqBars.classList.toggle('paused', audio.paused);
      currentCard = card;
    }
    if (failedTrackIndexes.has(globalIdx)) card.classList.add('broken');

    list.appendChild(card);
  });
  syncVisiblePlaybackState();
}

function setPlayingState(playing, eqBars, overlay) {
  const poly = overlay.querySelector('polygon');
  if (playing) {
    eqBars.classList.remove('paused');
    if (poly) poly.setAttribute('points', '6 19 10 19 10 5 6 5 6 19 14 5 18 5 18 19 14 19 14 5'); // pseudo pause icon inside circle
  } else {
    eqBars.classList.add('paused');
    if (poly) poly.setAttribute('points', '10 8 16 12 10 16 10 8');
    document.getElementById('icon-play').style.display = '';
    document.getElementById('icon-pause').style.display = 'none';
  }
}

function playTrack(idx, card, audio, trackVol, eqBars, overlay, options = {}) {
  if (failedTrackIndexes.has(idx)) {
    card.classList.add('broken');
    return;
  }

  /* if same track: toggle */
  if (currentIndex === idx && currentAudio) {
    if (currentAudio.paused) {
      currentAudio.play().catch(() => handleTrackError(idx));
      eqBars?.classList.remove('paused');
      card?.classList.add('playing');
      document.getElementById('icon-play').style.display = 'none';
      document.getElementById('icon-pause').style.display = '';
    } else {
      currentAudio.pause();
      eqBars?.classList.add('paused');
      document.getElementById('icon-play').style.display = '';
      document.getElementById('icon-pause').style.display = 'none';
    }
    return;
  }

  /* stop previous */
  if (currentAudio) {
    rememberGroupPlaybackTime(currentIndex, currentAudio);
    currentAudio.pause();
    if (currentCard) {
      currentCard.classList.remove('playing');
      /* reset old card eq bars */
      const oldEq = currentCard.querySelector('.eq-bars');
      if (oldEq) oldEq.classList.add('paused');
    }
  }

  currentAudio = audio;
  currentIndex = idx;
  currentCard  = card;
  currentAudio.loop = repeatOne;

  const file = audioFiles[idx];
  audio._useSharedTime = options.useSharedTime !== false;
  audio._resetOnMetadata = !!options.resetPosition;
  if (options.resetPosition) {
    seekAudio(audio, 0);
  } else if (audio._useSharedTime) {
    const sharedTime = sharedGroupPlaybackTime(file);
    if (sharedTime !== null) seekAudio(audio, sharedTime);
  }
  audio.volume = Math.min(1, parseFloat(trackVol.value) * globalVolume);
  audio.play().catch(() => handleTrackError(idx));

  /* update card */
  card?.classList.add('playing');
  eqBars?.classList.remove('paused');

  /* update bar */
  document.getElementById('now-thumb').src = file.albumCover;
  document.getElementById('now-title').textContent = fileLabel(file.path);
  document.getElementById('now-tags').textContent  = file.tags.join(' · ');
  document.getElementById('time-dur').textContent  = fmtTime(audio.duration);
  document.getElementById('icon-play').style.display  = 'none';
  document.getElementById('icon-pause').style.display = '';
  renderCueButtons(file);
}

function updateProgress(audio) {
  if (!audio.duration) return;
  rememberGroupPlaybackTime(currentIndex, audio);
  const pct = (audio.currentTime / audio.duration) * 100;
  const bar = document.getElementById('progress-bar');
  bar.value = pct;
  bar.style.backgroundSize = pct + '% 100%';
  document.getElementById('time-cur').textContent = fmtTime(audio.currentTime);
  document.getElementById('time-dur').textContent = fmtTime(audio.duration);
}

function syncVisiblePlaybackState() {
  document.querySelectorAll('.audio-item').forEach(card => {
    const idx = Number(card.dataset.idx);
    const audio = trackAudios.get(idx);
    const isCurrent = idx === currentIndex && currentAudio === audio;
    card.classList.toggle('playing', !!isCurrent);
    card.querySelector('.eq-bars')?.classList.toggle('paused', !isCurrent || audio?.paused !== false);
  });

  currentCard = currentVisuals(currentIndex).card || null;
}

/* ── PLAYER BAR CONTROLS ── */
document.getElementById('btn-play').onclick = () => {
  if (!currentAudio) return;
  if (currentAudio.paused) {
    currentAudio.play().catch(() => handleTrackError(currentIndex));
    const visuals = currentVisuals(currentIndex);
    currentCard = visuals.card || currentCard;
    if (visuals.card) visuals.card.classList.add('playing');
    visuals.eqBars?.classList.remove('paused');
    document.getElementById('icon-play').style.display  = 'none';
    document.getElementById('icon-pause').style.display = '';
  } else {
    currentAudio.pause();
    currentVisuals(currentIndex).eqBars?.classList.add('paused');
    document.getElementById('icon-play').style.display  = '';
    document.getElementById('icon-pause').style.display = 'none';
  }
};

document.getElementById('btn-seek-back').onclick = () => {
  if (currentAudio) {
    currentAudio.currentTime = Math.max(0, currentAudio.currentTime - 5);
    rememberGroupPlaybackTime(currentIndex, currentAudio);
  }
};
document.getElementById('btn-seek-fwd').onclick = () => {
  if (currentAudio) {
    currentAudio.currentTime = Math.min(currentAudio.duration || 0, currentAudio.currentTime + 5);
    rememberGroupPlaybackTime(currentIndex, currentAudio);
  }
};

const progressBar = document.getElementById('progress-bar');
progressBar.addEventListener('input', () => {
  if (currentAudio && currentAudio.duration) {
    currentAudio.currentTime = (progressBar.value / 100) * currentAudio.duration;
    rememberGroupPlaybackTime(currentIndex, currentAudio);
    progressBar.style.backgroundSize = progressBar.value + '% 100%';
  }
});

const volSlider = document.getElementById('volume-slider');
volSlider.value = 1;
volSlider.style.backgroundSize = '100% 100%';
volSlider.addEventListener('input', () => {
  globalVolume = parseFloat(volSlider.value);
  volSlider.style.backgroundSize = (globalVolume * 100).toFixed(1) + '% 100%';
  if (currentAudio) {
    const trackVol = currentCard?.querySelector('.card-vol input');
    const tv = trackVol ? parseFloat(trackVol.value) : 1;
    currentAudio.volume = Math.min(1, tv * globalVolume);
  }
});

function setModeButton(button, active) {
  button.classList.toggle('active', active);
  button.setAttribute('aria-pressed', String(active));
}

const repeatOneButton = document.getElementById('repeat-one');
const autoNextButton = document.getElementById('auto-next');

document.getElementById('repeat-one').onclick = e => {
  repeatOne = !repeatOne;
  if (repeatOne) autoNext = false;
  setModeButton(repeatOneButton, repeatOne);
  setModeButton(autoNextButton, autoNext);
  if (currentAudio) currentAudio.loop = repeatOne;
};

document.getElementById('auto-next').onclick = e => {
  autoNext = !autoNext;
  if (autoNext) repeatOne = false;
  setModeButton(autoNextButton, autoNext);
  setModeButton(repeatOneButton, repeatOne);
  if (currentAudio) currentAudio.loop = repeatOne;
};

/* ── CLOSE POPOVERS ON OUTSIDE CLICK ── */
/* drag & drop import */
['dragenter', 'dragover'].forEach(type => {
  document.addEventListener(type, e => {
    const hasFiles = [...(e.dataTransfer?.items || [])].some(item => item.kind === 'file');
    if (!hasFiles) return;
    e.preventDefault();
    document.body.classList.add('drag-over');
  });
});

document.addEventListener('dragleave', e => {
  if (e.relatedTarget) return;
  document.body.classList.remove('drag-over');
});

document.addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('drag-over');
  addDroppedAudioFiles(e.dataTransfer?.files || []);
});

document.addEventListener('click', e => {
  if (!e.target.closest('.info-btn') && !e.target.closest('.path-popover')) {
    document.querySelectorAll('.path-popover.open').forEach(p => p.classList.remove('open'));
  }
});

/* ── KEYBOARD ── */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') {
    e.preventDefault();
    document.getElementById('btn-play').click();
  }
  if (e.code === 'ArrowLeft')  document.getElementById('btn-seek-back').click();
  if (e.code === 'ArrowRight') document.getElementById('btn-seek-fwd').click();
});

/* ── INIT ── */
renderTags();
renderList();
</script>
